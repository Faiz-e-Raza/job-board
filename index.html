<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entry-Level Remote Tech Jobs</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; background: #fafafa; color: #1a1a1a; }
  h1 { font-size: 1.6rem; }
  .sub { color: #666; margin-bottom: 24px; }
  .job { background: #fff; border: 1px solid #e2e2e2; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .job h3 { margin: 0 0 4px 0; }
  .job a { color: #1a56db; text-decoration: none; }
  .job a:hover { text-decoration: underline; }
  .meta { color: #888; font-size: 0.85rem; margin-top: 6px; }
  .tag { display: inline-block; background: #eef2ff; color: #3730a3; border-radius: 4px; padding: 2px 8px; font-size: 0.75rem; margin-right: 4px; }
  #status { color: #888; }
</style>
</head>
<body>
  <h1>Entry-Level Remote Tech Jobs</h1>
  <div class="sub">Auto-updated daily. Filtered for junior / entry-level / graduate roles only.</div>
  <div id="status">Loading jobs...</div>
  <div id="jobs"></div>

<script>
fetch('jobs.json')
  .then(r => r.json())
  .then(data => {
    document.getElementById('status').textContent =
      `${data.count} jobs • updated ${new Date(data.generated_at).toLocaleString()}`;
    const container = document.getElementById('jobs');
    data.jobs.forEach(job => {
      const div = document.createElement('div');
      div.className = 'job';
      const tags = (job.tags || []).slice(0, 5).map(t => `<span class="tag">${t}</span>`).join('');
      div.innerHTML = `
        <h3><a href="${job.url}" target="_blank" rel="noopener">${job.title}</a></h3>
        <div>${job.company}</div>
        <div class="meta">${job.source} • ${job.date_posted || ''}</div>
        <div style="margin-top:8px;">${tags}</div>
      `;
      container.appendChild(div);
    });
    if (data.jobs.length === 0) {
      document.getElementById('status').textContent = 'No jobs found in latest run — check back after the next daily update.';
    }
  })
  .catch(() => {
    document.getElementById('status').textContent = 'jobs.json not found yet — it appears after the first Actions run.';
  });
</script>
</body>
</html>
